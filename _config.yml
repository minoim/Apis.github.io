# Chirpy 테마 설정
# QA Tech Blog

# 사이트 기본 정보
title: QA Tech Blog
tagline: 시니어 QA 전문가의 기술 블로그
description: 테스트 자동화, 품질 관리, QA 베스트 프랙티스를 공유합니다

# GitHub Pages 설정
url: "https://minoim.github.io"
baseurl: "/Apis.github.io"

# 테마 설정
theme: jekyll-theme-chirpy

# 언어 및 시간대
lang: ko-KR
timezone: Asia/Seoul

# 저자 정보
author: QA Engineer

# 소셜 링크
github:
  username: minoim

social:
  name: QA Engineer
  email: your-email@example.com
  links:
    - https://github.com/minoim

# 분석 (선택사항)
analytics:
  google:
    id: ""

# 페이지 설정
paginate: 10

# Chirpy 테마 설정
theme_mode: dark  # 다크모드 기본값

avatar: ""  # 프로필 이미지 URL (선택)

toc: true  # 목차 표시

comments:
  provider: ""  # giscus, disqus 등

# 빌드 설정
markdown: kramdown
highlighter: rouge

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true

# 퍼머링크
permalink: /posts/:title/

# 기본값
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _tabs
      type: pages
    values:
      layout: page
      permalink: /:title/

# 제외
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
