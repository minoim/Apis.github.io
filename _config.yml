# Jekyll 설정 파일
# QA Tech Blog

# 사이트 기본 정보
title: QA Tech Blog
description: 시니어 QA 전문가의 기술 블로그 - 테스트 자동화, 품질 관리, QA 베스트 프랙티스
author: QA Engineer

# GitHub Pages 설정
url: "https://minoim.github.io"
baseurl: "/Apis.github.io"

# 테마 설정
remote_theme: pages-themes/midnight@v0.2.0

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# 빌드 설정
markdown: kramdown
highlighter: rouge

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

# 퍼머링크 설정
permalink: /:year/:month/:day/:title/

# 기본값
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# 제외할 파일
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
